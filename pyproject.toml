[project]
name = "darwin-heliobiology"
version = "0.3.0"
description = "Computational platform for heliobiological studies: Sun ↔ mental health integration"
authors = [{ name = "Darwin Lab", email = "lab@agourakis.med.br" }, { name = "Demetrios Chiuratto Agourakis" }]
readme = "README.exocortex"
requires-python = ">=3.11"
keywords = ["heliobiology", "solar", "mental-health", "hrv", "geomagnetic", "circadian-rhythm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
]
dependencies = [
  "pydantic>=2.6",
  "numpy>=1.26",
  "pandas>=2.1",
  "plotly>=5.19",
  "requests>=2.31",
  "prophet>=1.1",
  "scikit-learn>=1.3",
  "scipy>=1.11",
  "neuralforecast>=1.7",
  "tigramite>=5.2"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.poetry.group.dev.dependencies]
pytest = ">=7.4"
pytest-cov = ">=4.1"
mypy = ">=1.8"
black = ">=24.3"
ruff = ">=0.1.6"
types-requests = ">=2.32"
pandas-stubs = ">=2.1.1"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = [
  "neuralforecast.*",
  "tigramite.*",
  "pytorch_lightning.*",
  "scipy.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-ra --maxfail=1"
testpaths = [
  "tests"
]

