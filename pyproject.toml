[project]
name = "darwin-heliobiology"
version = "0.1.0"
description = "Exocortex heliobiológico: integração Sol ↔ saúde mental"
authors = [{ name = "Darwin Lab", email = "lab@agourakis.med.br" }]
readme = "README.exocortex"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.6",
  "numpy>=1.26",
  "pandas>=2.1",
  "plotly>=5.19",
  "requests>=2.31",
  "prophet>=1.1",
  "scikit-learn>=1.3"
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
  "pytest-cov>=4.1",
  "mypy>=1.8",
  "black>=24.3",
  "ruff>=0.1.6"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true

[tool.pytest.ini_options]
addopts = "-ra --maxfail=1"
testpaths = [
  "tests"
]

